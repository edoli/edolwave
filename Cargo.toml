[package]
name = "edolwave"
version = "0.1.1"
edition = "2024"

description = "A fast, native waveform audio player built with GPUI"
license = "MIT"
rust-version = "1.96"

[dependencies]
anyhow = "1.0.104"
gpui = { version = "0.2.2", default-features = false, features = ["windows-manifest"] }
rodio = { version = "0.23.0", default-features = false, features = ["playback", "symphonia-all", "symphonia-simd"] }

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"

[profile.release]
opt-level = 2
lto = "off"
codegen-units = 16
incremental = true

[profile.release-dist]
inherits = "release"
opt-level = 3
lto = "thin"
codegen-units = 1
incremental = false
strip = "symbols"
panic = "abort"

[profile.dev]
debug = 1
