[package]
name = "edolwave"
version = "0.1.5"
edition = "2024"

description = "A fast, native waveform audio player built with GPUI"
license = "MIT"
rust-version = "1.96"

[dependencies]
anyhow = "1.0.104"
async-channel = "2"
dirs = "4"
gpui = { git = "https://github.com/edoli/zed", branch = "gpui-edol", default-features = false }
gpui_platform = { git = "https://github.com/edoli/zed", branch = "gpui-edol", default-features = false }
interprocess = { version = "2.4", features = ["tokio"] }
rodio = { version = "0.23.0", default-features = false, features = ["playback", "symphonia-all", "symphonia-simd"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
tokio = { version = "1", features = ["rt", "net", "time", "io-util", "sync", "macros"] }
ureq = { version = "3", default-features = false, features = ["rustls"] }

[target.'cfg(windows)'.dependencies]
widestring = "1"

[target.'cfg(target_os = "linux")'.dependencies]
gpui_platform = { git = "https://github.com/edoli/zed", branch = "gpui-edol", default-features = false, features = ["x11", "wayland"] }

[target.'cfg(target_os = "macos")'.dependencies]
gpui_platform = { git = "https://github.com/edoli/zed", branch = "gpui-edol", default-features = false, features = ["font-kit"] }
url = "2"

[dev-dependencies]
uuid = { version = "1", features = ["v4"] }

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"

[profile.release]
opt-level = 2
lto = "off"
codegen-units = 16
incremental = true

[profile.release-dist]
inherits = "release"
opt-level = 3
lto = "thin"
codegen-units = 1
incremental = false
strip = "symbols"
panic = "abort"

[profile.dev]
debug = 1
